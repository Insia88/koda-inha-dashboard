name: app-check
on:
  pull_request:
    paths: ['app/**']
  push:
    branches: [main]
    paths: ['app/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Vercel 함수 런타임 조건(require(esm) 불가)으로 공개 데모 핸들러를 띄워 본다.
      - run: npm run check:vercel
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
